# Example consuming-project file: <git-root>/.sphinx/config.yaml
version: 1
tombs:
  default:
    reference: "github:example/company-tomb?ref=main"
    lock:
      commit: "0123456789abcdef0123456789abcdef01234567"
      proclamation_fingerprint: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      decree_generation: 1
      locked_at: "2026-08-22T00:00:00Z"
    guardians:
      - name: workstation
        provider: apple-icloud-keychain
